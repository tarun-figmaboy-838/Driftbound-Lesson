<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lines &amp; Angles · Drone Defense flight training</title>
  <meta name="description" content="Lines & Angles, class 2: adjacent angles, linear pairs and vertically opposite angles, trained on the ship before the Drone Defense mission." />
  <meta name="theme-color" content="#0b1030" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Math&text=%E2%88%A0%E2%88%92&display=swap" />
  <!-- styles, in cascade order: tokens first, then each area of the page (src/styles/) -->
  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/hq.css" />
  <link rel="stylesheet" href="src/styles/narration.css" />
  <link rel="stylesheet" href="src/styles/stage.css" />
  <link rel="stylesheet" href="src/styles/buttons.css" />
  <link rel="stylesheet" href="src/styles/cards.css" />
  <link rel="stylesheet" href="src/styles/phone.css" />
  <link rel="stylesheet" href="src/styles/recall.css" />
  <link rel="stylesheet" href="src/styles/start.css" />
  <link rel="stylesheet" href="src/styles/intro.css" />
  <link rel="stylesheet" href="src/styles/pills.css" />
</head>
<body>
  <!-- the ship's strategy HQ (a picture made with Figma AI); the lesson plays on its big screen -->
  <div class="room" aria-hidden="true"><img class="room__pic" id="room-pic" alt="" draggable="false" /></div>

  <button class="mute" id="mute" type="button" aria-label="Sound on" aria-pressed="true">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path class="on" d="M4 9h4l5-4v14l-5-4H4z M16 8.5c1.6 1.8 1.6 5.2 0 7 M18.6 6c3 3.3 3 8.7 0 12" /><path class="off" d="M4 9h4l5-4v14l-5-4H4z M16.5 9.5l5 5 M21.5 9.5l-5 5" /></svg>
  </button>

  <!-- the start banner (Figma AI art): the satellite HQ in orbit, and one play button in the centre -->
  <div class="start" id="start">
    <img class="start__pic" src="assets/ui/start/banner.webp" alt="" draggable="false" />
    <h1 class="start__title"><img src="assets/ui/start/title.webp" alt="Drone Defense" draggable="false" /></h1>
    <button class="start__play" id="play" type="button" aria-label="Play"><img src="assets/ui/start/play.webp" alt="" draggable="false" /></button>
  </div>
  <main class="hq">
    <!-- the lesson: a hologram floating in the projector's light, in front of the hall's screen -->
    <section class="screen" id="screen" aria-labelledby="caption">
      <div class="stage" id="glass-in">
        <!-- the narration: one line, said aloud word by word; the bars are the voice's mouth -->
        <div class="caption" id="narration">
          <span class="voice" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <h1 id="caption"></h1>
        </div>
        <div class="view" id="view">
          <div class="fig" id="fig"></div>
          <div class="custom" id="custom"></div>
        </div>
        <div class="readout" id="readout" aria-live="polite"></div>
      </div>
    </section>
    <!-- the projector on the floor (Figma AI art) and its column of light, which the lesson floats in -->
    <div class="projector" aria-hidden="true">
      <div class="projector__beam"><i class="holo holo--dots"></i><i class="holo holo--glow"></i><i class="holo holo--scan"></i></div>
      <img class="projector__img" src="assets/ui/hall/projector.webp" alt="" draggable="false" />
    </div>

    <!-- under the screen, aligned to its edges: Back, the answers, Next -->
    <div class="bar">
      <button class="pill pill--blue back gone" id="back" type="button" aria-label="Back">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <div class="controls" id="controls"></div>
      <div class="next-wrap" id="next-wrap">
        <button class="pill pill--blue next" id="next" type="button"><span class="lbl">Next</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l9 7-9 7z" /></svg></button>
      </div>
    </div>
  </main>
  <p class="sr-only" id="sr" role="status" aria-live="polite"></p>

  <div class="fx" id="fx" aria-hidden="true"></div>
  <script type="module" src="src/main.js"></script>
  <script>
    // opened straight from the folder (file://), the browser blocks the lesson's code: Play says how to open it
    if (location.protocol === 'file:') {
      document.getElementById('play').addEventListener('click', () => {
        if (document.querySelector('.start__note')) return;
        const p = document.createElement('p');
        p.className = 'start__note';
        p.textContent = 'Open start.command to play';
        document.getElementById('start').appendChild(p);
      });
    }
  </script>
</body>
</html>
